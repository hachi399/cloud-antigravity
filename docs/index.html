<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud Antigravity Terminal</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase App & Auth SDK (v10 modular / CDN) -->
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="logo-area">
        <span class="icon">🕷️</span>
        <h1>Cloud Antigravity</h1>
      </div>
      <div id="auth-status" class="auth-status">
        <span class="status-indicator offline"></span>
        <span id="user-display">未認証</span>
      </div>
    </header>

    <!-- ログインセクション（未ログイン時） -->
    <section id="login-section" class="card login-card">
      <h2>ゼロトラスト認証</h2>
      <p class="description">正規の Google アカウントでのみ操作が許可されます。</p>
      <button id="login-btn" class="btn primary-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google アカウントで認証
      </button>
    </section>

    <!-- メイン操作セクション（ログイン後） -->
    <main id="app-section" class="hidden">
      <!-- PC連携ステータス -->
      <section class="card mini-card">
        <div class="card-header">
          <h3>📦 PC 投函コンテキスト</h3>
          <button id="refresh-inbox-btn" class="icon-btn" title="更新">🔄</button>
        </div>
        <div id="inbox-list" class="inbox-list">
          <span class="text-muted">読み込み中...</span>
        </div>
      </section>

      <!-- タスク投入フォーム -->
      <section class="card">
        <h2>⚡ 開発指示の投入</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="task-type">タスク分類</label>
            <select id="task-type">
              <option value="code">コード生成・リファクタリング</option>
              <option value="review">コードレビュー・品質検証</option>
              <option value="design">アーキテクチャ・設計立案</option>
              <option value="general">汎用開発タスク</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prompt">指示内容（プロンプト）</label>
            <textarea id="prompt" rows="5" placeholder="クラウド上の Antigravity に実行させたいタスクを入力..." required></textarea>
          </div>

          <button type="submit" id="submit-btn" class="btn action-btn">
            エージェントへ発令
          </button>
        </form>
      </section>

      <!-- 実行ステータス -->
      <section id="status-card" class="card status-card hidden">
        <div class="card-header">
          <h3>進捗ステータス</h3>
          <span id="task-badge" class="badge">待機中</span>
        </div>
        <p id="task-id-display" class="task-id text-muted"></p>
        <p id="task-summary" class="task-summary"></p>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>

      <div class="logout-area">
        <button id="logout-btn" class="text-btn">ログアウト</button>
      </div>
    </main>
  </div>
</body>
</html>
